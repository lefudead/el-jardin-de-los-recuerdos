<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f3d2b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>El Jardín de los Recuerdos</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- TOP BAR -->
    <header id="top-bar" class="top-bar">
      <div class="resource">
        <span class="resource-icon">💐</span>
        <span id="bouquet-counter" class="resource-value">0</span>
      </div>
      <div class="resource">
        <span class="resource-icon">🌸</span>
        <span id="petal-counter" class="resource-value">0</span>
      </div>
      <div id="zone-label" class="zone-label">Jardín de Primavera</div>
      <div id="time-label" class="time-label">☀️ Día</div>
    </header>

    <!-- SCREENS -->
    <main id="screen-container">
      <!-- MENU -->
      <section id="screen-menu" class="screen active">
        <div class="menu-content">
          <h1 class="game-title">🌸 El Jardín<br />de los Recuerdos</h1>
          <p class="game-subtitle">"No tienes que descubrirlo todo hoy."</p>
          <button id="btn-continue" class="btn btn-primary btn-big">Entrar al jardín</button>
          <button id="btn-reset" class="btn btn-ghost">Reiniciar el jardín</button>
        </div>
      </section>

      <!-- GARDEN -->
      <section id="screen-garden" class="screen">
        <div id="garden-area" class="garden-area"></div>
      </section>

      <!-- MAP -->
      <section id="screen-map" class="screen">
        <div class="panel-title">🗺️ Mapa</div>
        <div id="map-list" class="map-list"></div>
        <div id="map-support"></div>
      </section>

      <!-- JOURNAL -->
      <section id="screen-journal" class="screen">
        <div class="panel-title">📖 Diario</div>
        <div id="journal-content" class="journal-content"></div>
      </section>

      <!-- SHOP -->
      <section id="screen-shop" class="screen">
        <div class="panel-title">🛍️ Tienda</div>
        <div id="shop-zone-title" class="shop-zone-title"></div>
        <div id="shop-balance" class="shop-balance"></div>
        <div id="shop-list" class="shop-list"></div>
      </section>

      <!-- SETTINGS -->
      <section id="screen-settings" class="screen">
        <div class="panel-title">⚙️ Ajustes</div>
        <div class="settings-content">
          <label>Música
            <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.4" />
          </label>
          <label>Efectos
            <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="1" />
          </label>
          <label class="checkbox-label">Vibración
            <input type="checkbox" id="vibration-toggle" checked />
          </label>
          <div class="settings-section-title">🎵 Mi música (YouTube)</div>
          <label class="checkbox-label">Usar mi música en lugar de la del juego
            <input type="checkbox" id="external-music-toggle" />
          </label>
          <label class="settings-input">
            <span>Enlace de YouTube (video o playlist)</span>
            <input type="text" id="external-music-url" placeholder="https://www.youtube.com/watch?v=… o /playlist?list=…" />
          </label>
          <div class="settings-actions">
            <button id="btn-external-music-play" class="btn btn-ghost">▶ Escuchar</button>
            <button id="btn-external-music-stop" class="btn btn-ghost">⏹ Volver a la música del juego</button>
          </div>
          <div id="external-music-status" class="settings-status"></div>
          <button id="btn-export" class="btn btn-ghost">Exportar partida</button>
          <button id="btn-import" class="btn btn-ghost">Importar partida</button>
          <input type="file" id="export-file" accept="application/json" hidden />
          <div id="debug-panel" class="debug-panel" hidden>
            <button class="btn btn-debug" data-debug="petals">+1000 pétalos</button>
            <button class="btn btn-debug" data-debug="bouquets">+10 ramos</button>
            <button class="btn btn-debug" data-debug="time">Cambiar día/noche</button>
            <button class="btn btn-debug" data-debug="reset">Resetear</button>
          </div>
        </div>
      </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-btn" data-screen="garden" aria-label="Jardín">🌱</button>
      <button class="nav-btn" data-screen="map" aria-label="Mapa">🗺️</button>
      <button class="nav-btn" data-screen="journal" aria-label="Diario">📖</button>
      <button class="nav-btn" data-screen="shop" aria-label="Tienda">🛍️</button>
      <button class="nav-btn" data-screen="settings" aria-label="Ajustes">⚙️</button>
    </nav>

    <!-- NOTIFICATION -->
    <div id="notification" class="notification"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Reproductor de YouTube oculto para la música propia -->
  <div id="external-music-host" class="external-music-host"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
